name: build

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: macos-latest
          java: '25'
          arch: arm64
          runner: macos-latest
          expander_leg: macos-latest--arm64
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        distribution: ${{ matrix.distribution || 'temurin' }}
        java-version: ${{ matrix.java }}
        architecture: ${{ matrix.arch }}

    - uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ matrix.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ matrix.os }}-maven-

    - name: Build with maven
      run: ./mvnw -B --errors --activate-profiles ci,format-check 
        --no-transfer-progress package -DskipTests

    name: compile [${{ matrix.expander_leg }}]
    timeout-minutes: 150
